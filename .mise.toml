# Task conventions per https://standards.openhomefoundation.org/standards/task-conventions/
# Lifecycle tasks call script/*; convenience tasks wrap the pnpm scripts in
# package.json. Run `mise tasks` to discover them.

[tools]
node = "26"
pnpm = "11.24.0" # keep in sync with package.json's packageManager

[env]
# Loaded into every task's environment when present; missing file is ignored.
_.file = ".env"

# ── Lifecycle tasks (standard) ─────────────────────────────────────────

[tasks.setup]
description = "First-time project setup"
run = "script/setup"

[tasks.update]
description = "Update project after git pull"
run = "script/update"

[tasks.dev]
description = "Start the local dev server (watch mode)"
alias = "run"
run = "script/server"

[tasks.test]
description = "Run the test suite (extra args go to vitest, e.g. `mise run test -u`)"
run = "script/test"

[tasks.ci]
description = "Run the full CI suite (lint, typecheck, test, build)"
run = "script/cibuild"

# ── Convenience tasks ──────────────────────────────────────────────────

[tasks.build]
description = "Compile the production bundle (skipped when dist/ is up to date)"
run = "pnpm run build"
sources = ["src/**/*", "package.json", "pnpm-lock.yaml", "tsconfig.json", "tsconfig.build.json", ".swcrc", "nest-cli.json"]
outputs = ["dist/**/*"]

[tasks.lint]
description = "Run biome (lint + format check)"
run = "pnpm run lint"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "pnpm run typecheck"

[tasks.format]
description = "Auto-format code"
run = "pnpm run format"

[tasks.check]
description = "Run all quality checks (lint, typecheck) without build"
depends = ["lint", "typecheck"]

[tasks."test:coverage"]
description = "Run the test suite with coverage"
alias = "coverage"
run = "pnpm run test:coverage"

# ── Project-specific tasks ─────────────────────────────────────────────

[tasks.capture]
description = "Start the webhook capture server (writes raw fixtures)"
run = "pnpm run capture"

[tasks.scrub]
description = "Re-scrub existing captured webhook fixtures"
run = "pnpm run scrub"

[tasks.capture-discord]
description = "Capture Discord gateway fixtures (needs DISCORD_TOKEN)"
depends = ["build"]
run = "node scripts/capture-discord.ts"

[tasks.sync-templates]
description = "Vendor the upstream PR templates and re-render fixture bodies"
run = "pnpm run sync-templates"

[tasks.check-io-sections]
description = "List home-assistant.io sections the section labels don't cover"
run = "pnpm run check-io-sections"
