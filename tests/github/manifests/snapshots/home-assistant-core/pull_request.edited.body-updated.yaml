effects:
  - type: addLabels
    labels:
      - Top 50
      - Top 100
      - Top 200
  - type: addAssignees
    assignees:
      - balloob
  - type: comment
    body: |-
      <!-- ha-bot-mention -->
      <!-- ha-bot-mention-integrations: hue -->

      Hey there @balloob, mind taking a look at this pull request as it has been labeled with an integration (`hue`) you are listed as a [code owner](https://github.com/home-assistant/core/blob/HEAD/CODEOWNERS#L1) for? Thanks!
      <details><summary>Code owner commands</summary>

      Reply with `@home-assistant <command>`:

      - `update` — Re-runs the bot's checks on the issue or pull request.
      - `ignore` — Waives a dashboard check: `ignore "<check name>" "<reason>"`. *(author)* — e.g. `@home-assistant ignore "Merge conflicts" "Broken rule, no merge conflicts present"`
      - `unignore` — Restores a waived dashboard check: `unignore "<check name>"`. *(author)* — e.g. `@home-assistant unignore "Merge conflicts"`
      - `unassign` — Removes the given integration domain's label and its code owners from the assignees. *(author or code owners)* — e.g. `@home-assistant unassign "opensky"`
      - `close` — Closes the issue or pull request. *(code owners)*
      - `reopen` — Reopens the issue or pull request. *(code owners)*
      - `rename` — Renames the issue or pull request: `rename "<new title>"`. *(code owners)* — e.g. `@home-assistant rename "A more descriptive title"`
      - `add-label` — Adds a label (needs-more-information, problem in dependency, problem in custom component, problem in config, problem in device, feature-request) to the issue or pull request. *(code owners)* — e.g. `@home-assistant add-label "needs-more-information"`
      - `remove-label` — Removes a label (needs-more-information, problem in dependency, problem in custom component, problem in config, problem in device, feature-request) from the issue or pull request. *(code owners)* — e.g. `@home-assistant remove-label "needs-more-information"`
      - `mark-draft` — Marks the pull request as draft. *(code owners)*
      - `update-branch` — Updates the pull request branch with the base branch. *(code owners)*

      </details>
  - type: addLabels
    labels:
      - bugfix
      - code-quality
  - type: addLabels
    labels:
      - has-tests
      - small-pr
