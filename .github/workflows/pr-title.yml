name: Verify PR title

# PRs are squash-merged, so the PR title becomes the commit message on main —
# release-please parses those to resolve versions and build the changelog.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main

permissions:
  pull-requests: read

jobs:
  verify:
    name: Verify PR title
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
