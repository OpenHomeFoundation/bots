name: Release

on:
  release:
    types:
      - published

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

permissions: {}

jobs:
  deploy-container:
    name: Deploy container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to mint a signed build provenance attestation via Sigstore.
      id-token: write
      attestations: write
      # Lets the attest step list the image on the org's Linked Artifacts page.
      artifact-metadata: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get lowercase owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exact versions without the leading v (tag v0.3.0 is image 0.3.0); the
      # Terraform workspace's bots_image_tag uses the same form.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/bots
          tags: type=semver,pattern={{version}}
          flavor: latest=false

      - name: Build and push the container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner }}/bots
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Bump the image tag in the Terraform Cloud variable set, then queue a
      # run that applies itself.
      # Whether the service actually runs is the workspace's
      # bots_desired_count, not this workflow: a release before the cutover
      # rolls the task definition forward while the service stays at 0 tasks.
      - name: Update Terraform variable set
        env:
          TF_TOKEN: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
          VARSET_ID: ${{ secrets.TERRAFORM_CLOUD_VARSET_ID }}
          VAR_KEY: bots_image_tag
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          variable_id=$(curl -sSL \
            --header "Authorization: Bearer $TF_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --request GET \
              "https://app.terraform.io/api/v2/varsets/$VARSET_ID/relationships/vars" \
              | jq -r --arg k "$VAR_KEY" '.data[] | select(.attributes.key == $k) | .id')

          if [ -z "$variable_id" ] || [ "$variable_id" = "null" ]; then
            echo "::error::Variable '$VAR_KEY' not found in the configured variable set" >&2
            exit 1
          fi

          # The response body echoes the full variable object, so it is
          # discarded, and --fail makes a non-2xx fail the step.
          curl -sSL --fail -o /dev/null \
            --header "Authorization: Bearer $TF_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --request PATCH \
            --data "$(jq -n --arg v "$VERSION" '{data: {type: "vars", attributes: {value: $v}}}')" \
              "https://app.terraform.io/api/v2/varsets/$VARSET_ID/relationships/vars/$variable_id"

      - name: Trigger Terraform apply
        env:
          TF_TOKEN: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
          TF_ORG: ohf
          TF_WORKSPACE: bots
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The variable set update above does not queue a run on its own, so we
          # create one explicitly and let Terraform Cloud apply it without manual
          # confirmation. bots is its own workspace/state, so this only
          # deploys the bots service; shared infrastructure is untouched.
          workspace_id=$(curl -sSL \
            --header "Authorization: Bearer $TF_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --request GET \
              "https://app.terraform.io/api/v2/organizations/$TF_ORG/workspaces/$TF_WORKSPACE" \
              | jq -r '.data.id')

          if [ -z "$workspace_id" ] || [ "$workspace_id" = "null" ]; then
            echo "::error::Could not resolve Terraform Cloud workspace '$TF_WORKSPACE'" >&2
            exit 1
          fi

          run_id=$(curl -sSL \
            --header "Authorization: Bearer $TF_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data "$(jq -n --arg ws "$workspace_id" --arg v "$VERSION" '{
              data: {
                type: "runs",
                attributes: {
                  message: "Deploy bots \($v) (release action)",
                  "auto-apply": true
                },
                relationships: {
                  workspace: { data: { type: "workspaces", id: $ws } }
                }
              }
            }')" \
              "https://app.terraform.io/api/v2/runs" \
              | jq -r '.data.id')

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Failed to create Terraform Cloud run" >&2
            exit 1
          fi

          echo "Triggered Terraform Cloud run $run_id (auto-apply) for $TF_WORKSPACE"
