name: Release Please

# Maintains a release PR from the conventional commits on main (squash-merged
# PR titles). Merging it bumps package.json, updates CHANGELOG.md, then tags
# and publishes the GitHub release, which starts the deploy in release.yml.
# Runs as the OHF Release Bot app (org-level RELEASE_APP_CLIENT_ID variable and
# RELEASE_APP_PRIVATE_KEY secret) because events created with GITHUB_TOKEN do
# not start workflows.

on:
  push:
    branches:
      - main

# The app token does all the writing; GITHUB_TOKEN needs nothing.
permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Mint an OHF Release Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Update the release PR / publish the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
